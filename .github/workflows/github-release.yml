name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing final production tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: github-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish immutable production tag
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate production tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Only final production tags vX.Y.Z can create GitHub Releases: $RELEASE_TAG" >&2
            exit 1
          fi
          git fetch origin main --tags
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"
          git merge-base --is-ancestor "refs/tags/$RELEASE_TAG^{commit}" origin/main || {
            echo "Tag $RELEASE_TAG is not reachable from origin/main." >&2
            exit 1
          }

      - name: Publish GitHub Release
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists; nothing to publish."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "Camerae $RELEASE_TAG" \
            --generate-notes
